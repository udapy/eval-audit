[project]
name = "eval-audit"
version = "0.3.0"
description = "Offline evaluation-validity audit for saved multiple-choice results"
readme = "docs/PACKAGE-README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "build>=1.2", "setuptools>=77.0.3", "wheel"]
plots = ["matplotlib>=3.9"]
mcp = ["mcp>=2,<3"]

[project.scripts]
eval-audit = "eval_audit.cli:entrypoint"
eval-audit-mcp = "eval_audit.mcp_server:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_audit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
